name: deploy-web

# Publishes the dashboard (Cloudflare Worker pitwall-web, static assets) on every dashboard change
# on main. ci.yaml skips main, so the same checks run here before anything goes out.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Undo a bad release: `yarn wrangler rollback` in dashboard/, or revert the commit on main.

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-web.yaml"
  workflow_dispatch:

# Queue rather than cancel: a deploy stopped halfway helps nobody, and the newest run still lands last.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc

      # Before any yarn call: see ci.yaml.
      - run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: |
            ~/.yarn/berry/cache
            dashboard/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('dashboard/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn cf:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Deploy
        run: yarn wrangler deploy --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the site answers
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null https://pitwall-web.pitwall-realtime.workers.dev/dashboard
