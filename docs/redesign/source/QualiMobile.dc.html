<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pitwall · Qualifying (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0C0F}
a{color:#A4AAB4}a:hover{color:#ECEEF1}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #0A0C0F; color: #ECEEF1; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; flex: none">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="#ECEEF1"></rect><path d="M8 8l4 4-4 4M13 16h4" fill="none" stroke="#0A0C0F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <div style="display: flex; flex-direction: column; min-width: 0">
      <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Canadian GP</span>
      <span style="font-size: 11px; color: #A4AAB4">Qualifying · <span style="font-family: 'Geist Mono', monospace">11:53:58</span></span>
    </div>
    <button type="button" aria-label="Live, delay 0 seconds. Change delay" style="margin-left: auto; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #252A33; background: #111419; color: #ECEEF1; font-family: Geist, sans-serif; font-size: 12px">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #3DDC97"></span>Live<span style="font-family: 'Geist Mono', monospace; color: #A4AAB4">0s</span>
    </button>
  </header>

  <section aria-label="Session status" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-top: 1px solid #1C2128; border-bottom: 1px solid #1C2128; flex: none">
    <span style="height: 22px; padding: 0 7px; display: flex; align-items: center; border-radius: 5px; background: #ECEEF1; color: #0A0C0F; font-size: 11px; font-weight: 700">Q1</span>
    <span style="font-family: 'Geist Mono', monospace; font-size: 20px; font-weight: 600; line-height: 1">08:42</span>
    <span style="font-size: 11px; color: #7C838F">left</span>
    <div role="status" style="margin-left: auto; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; background: rgba(61, 220, 151, 0.14); color: #3DDC97; font-size: 12px; font-weight: 600">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22V4M5 4h13l-2.5 4.5L18 13H5"></path></svg>Track clear
    </div>
  </section>

  <a href="MapMobile.dc.html" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; margin: 6px 8px 2px; border-radius: 8px; background: #111419; border: 1px solid #1C2128; text-decoration: none; flex: none">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #3DDC97"></span>
    <span style="font-size: 12px; color: #ECEEF1; font-weight: 600">{{pushCount}} on push laps</span>
    <span style="font-size: 12px; color: #A4AAB4">Cut-off <span style="font-family: 'Geist Mono', monospace; color: #ECEEF1">{{cutoff}}</span></span>
    <svg style="margin-left: auto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
  </a>

  <div style="display: grid; grid-template-columns: 20px 40px minmax(0, 1fr) 70px 54px; column-gap: 6px; align-items: center; height: 22px; padding: 0 12px; font-size: 10px; font-weight: 500; letter-spacing: 0.05em; color: #7C838F; flex: none">
    <span style="text-align: right">P</span><span>DRIVER</span><span style="text-align: right">GAP</span><span style="text-align: right">BEST</span><span>STATUS</span>
  </div>

  <div style="flex: 1; min-height: 0; padding: 0 6px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="22">
      <sc-if value="{{r.cut}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 8px; height: 16px; padding: 0 6px"><span style="flex: 1; height: 1px; background: rgba(255, 122, 107, 0.5)"></span><span style="font-size: 9px; font-weight: 600; letter-spacing: 0.06em; color: #FF7A6B">KNOCKOUT</span><span style="flex: 1; height: 1px; background: rgba(255, 122, 107, 0.5)"></span></div>
      </sc-if>
      <div style="display: grid; grid-template-columns: 20px 40px minmax(0, 1fr) 70px 54px; column-gap: 6px; align-items: center; height: 26px; padding: 0 6px; border-radius: 5px; background: {{r.rowBg}}; font-family: 'Geist Mono', monospace; font-size: 13px; font-variant-numeric: tabular-nums">
        <span style="text-align: right; font-size: 12px; color: {{r.posColor}}">{{r.pos}}</span>
        <span style="display: inline-block; width: 40px; text-align: center; padding: 1px 0; border-radius: 4px; font-family: Geist, sans-serif; font-size: 11px; font-weight: 700; background: {{r.team}}; color: {{r.ink}}">{{r.tla}}</span>
        <span style="text-align: right; color: {{r.gapColor}}">{{r.gap}}</span>
        <span style="text-align: right; font-size: 12px; color: {{r.bestColor}}">{{r.best}}</span>
        <span style="display: flex; align-items: center; gap: 4px; font-family: Geist, sans-serif; font-size: 11px; font-weight: 500; color: {{r.stColor}}"><span style="width: 5px; height: 5px; border-radius: 50%; background: {{r.stColor}}"></span>{{r.status}}</span>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Dashboard" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 60px; margin-top: 6px; border-top: 1px solid #1C2128; background: #0D1014; flex: none">
    <a href="QualiMobile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #ECEEF1; font-size: 11px; font-weight: 500; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M10 2h4"></path></svg>Live</a>
    <a href="MapMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Map</a>
    <a href="MessagesMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Messages</a>
    <a href="StrategyMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5z"></path><path d="m2 13 10 5 10-5"></path></svg>Strategy</a>
    <a href="MoreMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { purple: '#B08CFF', green: '#3DDC97', pit: '#4DA3FF', t1: '#ECEEF1', t2: '#A4AAB4', t3: '#7C838F', loss: '#FF7A6B' };
    const TEAM = { mer: '#27F4D2', fer: '#E8002D', rbr: '#4781D7', mcl: '#FF8000', ast: '#229971', alp: '#E0418F', wil: '#1868DB', rb: '#6C98FF', haa: '#B6BABD', aud: '#8A1538', cad: '#E6B800' };
    const DT = { ANT: 'mer', RUS: 'mer', HAM: 'fer', LEC: 'fer', VER: 'rbr', HAD: 'rbr', COL: 'alp', GAS: 'alp', LAW: 'rb', LIN: 'rb', BEA: 'haa', OCO: 'haa', ALO: 'ast', STR: 'ast', ALB: 'wil', SAI: 'wil', NOR: 'mcl', PIA: 'mcl', BOT: 'cad', PER: 'cad', HUL: 'aud', BOR: 'aud' };
    const lum = (hex) => { const n = parseInt(hex.slice(1), 16); const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2]; };
    const ink = (hex) => { const L = lum(hex); return 1.05 / (L + 0.05) >= (L + 0.05) / 0.0537 ? '#FFFFFF' : '#0A0C0F'; };
    const fmt = (s) => { if (s == null) return '—'; const m = Math.floor(s / 60); const r = (s - m * 60).toFixed(3); return m + ':' + (r < 10 ? '0' : '') + r; };
    // Same SAMPLE Q1 state as the desktop qualifying artboards.
    const q = [
      ['RUS', 72.104, 'track'], ['ANT', 72.211, 'pit'], ['VER', 72.356, 'push'], ['LEC', 72.402, 'pit'], ['HAM', 72.455, 'track'], ['NOR', 72.498, 'out'],
      ['PIA', 72.560, 'push'], ['HAD', 72.611, 'track'], ['ALO', 72.702, 'pit'], ['LAW', 72.745, 'push'], ['GAS', 72.810, 'pit'], ['ALB', 72.866, 'track'],
      ['HUL', 72.903, 'pit'], ['BEA', 72.950, 'out'], ['OCO', 72.988, 'pit'], ['SAI', 73.021, 'push'], ['BOR', 73.044, 'push'], ['LIN', 73.130, 'push'],
      ['STR', 73.276, 'pit'], ['COL', 73.402, 'out'], ['BOT', null, 'pit'], ['PER', null, 'pit']
    ];
    const ST = { push: ['Push', C.green], out: ['Out lap', C.t2], pit: ['Pit', C.pit], track: ['—', C.t3] };
    const leader = q[0][1];
    const rows = q.map((r, idx) => {
      const team = TEAM[DT[r[0]]];
      const ko = idx >= 16;
      return {
        pos: idx + 1, tla: r[0], team: team, ink: ink(team),
        gap: r[1] == null ? 'No time' : idx === 0 ? 'Fastest' : '+' + (r[1] - leader).toFixed(3), gapColor: r[1] == null || idx === 0 ? C.t3 : C.t1,
        best: fmt(r[1]), bestColor: idx === 0 ? C.purple : r[1] == null ? C.t3 : C.t2,
        status: ST[r[2]][0], stColor: ST[r[2]][1], cut: idx === 16,
        rowBg: ko ? 'rgba(255, 122, 107, 0.07)' : idx % 2 === 1 ? '#13171C' : 'transparent', posColor: ko ? C.loss : C.t2
      };
    });
    return { rows: rows, pushCount: q.filter((r) => r[2] === 'push').length, cutoff: fmt(q[15][1]) };
  }
}
</script>
</body>
</html>
